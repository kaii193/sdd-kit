name: SDD Check
on:
  pull_request:

jobs:
  sdd:
    if: startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate G1/G2 — spec & plan đã duyệt
        run: bash sdd/scripts/check-spec.sh
        env:
          SDD_BRANCH: ${{ github.head_ref }}
      - name: Phạm vi thay đổi khớp mục Phụ thuộc
        run: bash sdd/scripts/check-scope.sh
        env:
          SDD_BRANCH: ${{ github.head_ref }}
          SDD_BASE: origin/${{ github.base_ref }}
